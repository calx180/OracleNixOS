# hyprlock.conf — calxNixOS
# background.path = screenshot tells hyprlock to capture the screen itself
# (GPU-accelerated) the moment it launches — no external screenshot tool,
# no file write/read round-trip. This is what removes most of the delay
# after pressing SUPER+L.

$time_color   = rgba(cbab86ff)   # warm tan — hour/minute
$text_color   = rgba(d7d0c4ff)   # soft warm grey — day/date/weather
$field_color  = rgba(cbab8659)   # translucent outline for the input field

background {
    monitor =
    path = screenshot

    # lighter blur — screen contents should be vaguely visible through this,
    # not fully obscured
    blur_size = 4
    blur_passes = 2
    noise = 0.0117
    contrast = 1.0500
    brightness = 0.8000
    vibrancy = 0.1500
    vibrancy_darkness = 0.1000
}

# Hour
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $time_color
    font_size = 84
    font_family = Geist Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 65
    halign = center
    valign = center
}

# Minute
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $time_color
    font_size = 84
    font_family = Geist Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, -22
    halign = center
    valign = center
}

# Weekday (locale-aware — will print "domingo" etc. if your $LANG/LC_TIME is es_*)
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> $(date +'%A' | tr '[:upper:]' '[:lower:]') </big></b>"
    color = $text_color
    font_size = 17
    font_family = JetBrainsMono Nerd Font 10

    position = 0, -132
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> $(date +'%d %b' | tr '[:upper:]' '[:lower:]') </b>"
    color = $text_color
    font_size = 14
    font_family = JetBrainsMono Nerd Font 10

    position = 0, -155
    halign = center
    valign = center
}

# Feels like
label {
    monitor =
    text = cmd[update:18000000] echo "<b>Feels like <big>$(curl -s 'wttr.in?format=%t' | tr -d '+')</big></b>"
    color = $text_color
    font_size = 14
    font_family = Geist Mono 10

    position = 0, 45
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 200, 42
    outline_thickness = 3

    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1

    rounding = 18
    outer_color = $field_color
    inner_color = rgba(00000066)
    font_color = $time_color
    fade_on_empty = true
    placeholder_text = <i>Password...</i>

    position = 0, 120
    halign = center
    valign = bottom
}
